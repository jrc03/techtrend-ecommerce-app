<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TechTrend</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="registro.css" />
    <link rel="stylesheet" href="output.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <script src="components.js" defer></script>
    <script src="form-validation.js" defer></script>
    <script src="main.js" defer></script>
  </head>

  <body class="body min-h-screen flex flex-col">
    <!-- Header y menú móvil cargados dinámicamente -->
    <header id="header-container"></header>
    <main
      class="bg-(--color-bg-login) flex justify-center items-center py-4 px-5 flex-1"
    >
      <section class="register w-full max-w-[500px]">
        <h1 class="text-white text-2xl font-semibold text-center mt-0 mb-6">
          Registrarse a TechTrend
        </h1>
        <form action="" method="post" novalidate class="flex flex-col gap-6">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
            <div class="form-group flex flex-col gap-1">
              <label for="nombre" class="text-white text-base font-normal"
                >Nombre</label
              >
              <input
                type="text"
                id="nombre"
                name="nombre"
                required
                class="border-0 bg-[#595959] rounded-lg p-4 text-white font-[Jost] text-base outline-none transition-colors duration-300 focus:bg-[#6a6a6a] placeholder:text-white/70"
              />
              <small class="error-message text-[#e74c3c] text-sm mt-1 invisible"
                >.</small
              >
            </div>
            <div class="form-group flex flex-col gap-1">
              <label for="apellidos" class="text-white text-base font-normal"
                >Apellidos</label
              >
              <input
                type="text"
                id="apellidos"
                name="apellidos"
                required
                class="border-0 bg-[#595959] rounded-lg p-4 text-white font-[Jost] text-base outline-none transition-colors duration-300 focus:bg-[#6a6a6a] placeholder:text-white/70"
              />
              <small class="error-message text-[#e74c3c] text-sm mt-1 invisible"
                >.</small
              >
            </div>
          </div>
          <div class="form-group flex flex-col gap-1">
            <label for="correo" class="text-white text-base font-normal"
              >Correo</label
            >
            <input
              type="email"
              id="correo"
              name="correo"
              required
              class="border-0 bg-[#595959] rounded-lg p-4 text-white font-[Jost] text-base outline-none transition-colors duration-300 focus:bg-[#6a6a6a] placeholder:text-white/70"
            />
            <small class="error-message text-[#e74c3c] text-sm mt-1 invisible"
              >.</small
            >
          </div>
          <div class="form-group flex flex-col gap-1">
            <label for="contrasena" class="text-white text-base font-normal"
              >Contraseña</label
            >
            <input
              type="password"
              name="contrasena"
              id="contrasena"
              class="border-0 bg-[#595959] rounded-lg p-4 text-white font-[Jost] text-base outline-none transition-colors duration-300 focus:bg-[#6a6a6a] placeholder:text-white/70"
            />
            <small class="error-message text-[#e74c3c] text-sm mt-1 invisible"
              >.</small
            >
          </div>
          <div class="form-group flex flex-col gap-1 mb-2">
            <label for="direccion" class="text-white text-base font-normal"
              >Dirección</label
            >
            <input
              type="text"
              name="direccion"
              id="direccion"
              class="border-0 bg-[#595959] rounded-lg p-4 text-white font-[Jost] text-base outline-none transition-colors duration-300 focus:bg-[#6a6a6a] placeholder:text-white/70"
            />
            <small class="error-message text-[#e74c3c] text-sm mt-1 invisible"
              >.</small
            >
          </div>
          <button
          id="submitBtn"  
            type="submit"
            class="self-center inline-block bg-primary hover:bg-[#0080dd] text-white font-semibold rounded-full py-3 px-6 w-1/2 transition duration-200 hover:-translate-y-0.5 active:translate-y-0"
          >
            Enviar
          </button>
        </form>
      </section>
    </main>
    <footer
      class="flex flex-col items-center justify-center bg-bg-footer w-full text-primary-light py-4"
    >
      <p class="footer-text">
        © <span id="current-year"></span> TechTrend. Todos los derechos
        reservados.
      </p>
      <p class="footer-text">
        Contacto:
        <a href="mailto:info@techtrend.com" class="hover:underline"
          >info@techtrend.com</a
        >
      </p>
    </footer>
  </body>
</html>
